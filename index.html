<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="点検記録">
<meta name="theme-color" content="#f4f1ea">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>点検記録</title>
<style>
:root{
  --bg:#f4f1ea; --card:#fffdf8; --ink:#1f2a30; --sub:#5d6870; --line:#ddd6c8;
  --accent:#1d5c63; --accent-soft:#dcebea;
  --warn:#b4541a; --warn-soft:#fbe9dc; --ok:#2f7a3d; --ok-soft:#e1f0e2; --err:#a8322d;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;font-size:17px;line-height:1.55}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 20px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
header h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.04em}
main{max-width:980px;margin:0 auto;padding:16px 18px 40px}
h2{font-size:18px;margin:24px 0 10px}
h2:first-child{margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin:12px 0}
.muted{color:var(--sub);font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 16px;min-height:48px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
button.big{font-size:19px;padding:14px 22px;min-height:60px}
button.small{min-height:38px;padding:6px 14px;font-size:15px}
button:disabled{opacity:.45}
button.danger{color:var(--err);border-color:#e3c3c0}
input,select{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:46px}
.papers{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.papers button{text-align:left;justify-content:flex-start;min-height:60px;font-size:15px;line-height:1.3;flex-direction:column;align-items:flex-start}
.papers button.sel{background:var(--accent-soft);border-color:var(--accent);font-weight:700}
.papers .cnt{font-size:13px;color:var(--sub);font-weight:400}
.papers .cnt.full{color:var(--ok);font-weight:700}
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;border:0;background:none;border-radius:10px;min-height:62px;font-size:14px;color:var(--sub);flex-direction:column;gap:2px;position:relative}
nav button .ic{font-size:22px;line-height:1}
nav button.on{color:var(--accent);font-weight:700;background:var(--accent-soft)}
.dot{position:absolute;top:8px;right:calc(50% - 26px);width:12px;height:12px;border-radius:50%;background:var(--warn)}
.notice{border-left:5px solid var(--warn);background:var(--warn-soft);border-radius:10px;padding:12px 14px;margin:0 0 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.notice.ok{border-left-color:var(--ok);background:var(--ok-soft)}
.datebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.datebar .d{font-size:20px;font-weight:700;min-width:150px;text-align:center}
table.grid{width:100%;border-collapse:collapse;font-size:15px}
table.grid th,table.grid td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:middle}
table.grid th{white-space:nowrap;font-size:13px;color:var(--sub);font-weight:600;position:sticky;top:57px;background:var(--card);z-index:1}
table.grid tr.grp td{background:#efe9dc;font-weight:700;font-size:14px}
table.grid td.lab{width:44%}
table.grid td.lab .std{color:var(--sub);font-size:12px}
table.grid td.prev{color:var(--sub);font-size:13px;white-space:nowrap;width:1%}
table.grid td.in{width:22%}
table.grid input{width:100%;min-width:76px;min-height:44px;padding:6px 8px;text-align:right;font-size:18px}
table.grid input.txt{text-align:center}
table.grid input.saved{background:#e8f3e9}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#22313a;color:#fff;padding:12px 20px;border-radius:12px;z-index:50;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:.95}
.overlay{position:fixed;inset:0;background:rgba(20,26,30,.55);z-index:40;display:flex;align-items:center;justify-content:center;padding:20px}
.dialog{background:var(--card);border-radius:16px;max-width:560px;width:100%;padding:22px;max-height:88vh;overflow:auto}
.spin{display:inline-block;width:18px;height:18px;border:3px solid var(--accent-soft);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-3px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.stat{display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-size:15px}
.months{width:100%;border-collapse:collapse;font-size:15px}
.months td{border-bottom:1px solid var(--line);padding:8px 6px}
.pill{display:inline-block;font-size:13px;padding:2px 10px;border-radius:999px;background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.hide{display:none!important}
.lock{max-width:420px;margin:12vh auto;padding:0 20px;text-align:center}
.lock input{width:100%;margin:14px 0;text-align:center}
.note{font-size:14px;background:#efe9dc;border-radius:10px;padding:10px 14px}
</style>
</head>
<body>
<div id="lock" class="lock hide">
  <h1 style="font-size:24px">点検記録</h1>
  <p class="muted">最初の1回だけ、パスワードを入れてください。</p>
  <input id="pw" type="password" autocomplete="current-password" placeholder="パスワード">
  <button class="primary big" style="width:100%" onclick="unlock()">開く</button>
  <p id="pwmsg" class="muted"></p>
</div>

<div id="app" class="hide">
<header><h1 id="title">入力</h1></header>
<main id="main"></main>
<nav>
  <button data-tab="input" onclick="go('input')"><span class="ic">✏️</span>入力</button>
  <button data-tab="month" onclick="go('month')"><span class="ic">📤</span>月次Excel<span class="dot hide" id="mdot"></span></button>
  <button data-tab="set" onclick="go('set')"><span class="ic">⚙️</span>設定</button>
</nav>
</div>
<div id="toast" class="toast"></div>

/* ========== 暗号化データの読み込み ========== */
async function decryptPayload(pw) {
  const p = JSON.parse(atob(ENC));
  const salt = b64ToBytes(p.salt), iv = b64ToBytes(p.iv), data = b64ToBytes(p.data);
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: p.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
  const obj = JSON.parse(new TextDecoder().decode(plain));
  SPEC = obj.spec; TEMPLATE = b64ToBytes(obj.template);
}
async function unlock() {
  const pw = $('#pw').value.trim(); if (!pw) return;
  $('#pwmsg').textContent = '確認中…';
  try { await decryptPayload(pw); LS.set('pw', pw); start(); }
  catch (e) { $('#pwmsg').textContent = 'パスワードが違います。'; }
}

/* ========== 保存（iPad内のデータベース） ========== */
let DB;
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('tenkenDB', 1);
    r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains('vals')) d.createObjectStore('vals'); };
    r.onsuccess = () => { DB = r.result; res(); }; r.onerror = () => rej(r.error);
  });
}
function tx(mode, fn) {
  return new Promise((res, rej) => {
    const t = DB.transaction('vals', mode); const s = t.objectStore('vals'); let out;
    const r = fn(s); if (r) r.onsuccess = () => { out = r.result; };
    t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
}
const dbPut = (k, v) => tx('readwrite', s => s.put(v, k));
const dbDel = k => tx('readwrite', s => s.delete(k));
function dbPutMany(entries) {
  return new Promise((res, rej) => {
    const t = DB.transaction('vals', 'readwrite'); const s = t.objectStore('vals');
    for (const [k, v] of entries) v === null ? s.delete(k) : s.put(v, k);
    t.oncomplete = res; t.onerror = () => rej(t.error);
  });
}
// 値のキー： 日付|シート番号|行|時刻(0=10:00または1回のみ, 1=16:00)
const vkey = (date, si, r, slot) => `${date}|${si}|${r}|${slot}`;
async function valsRange(range) {
  const [keys, vals] = await Promise.all([tx('readonly', s => s.getAllKeys(range)), tx('readonly', s => s.getAll(range))]);
  const m = new Map(); keys.forEach((k, i) => m.set(k, vals[i])); return m;
}
const valsOfDates = (d1, d2) => valsRange(IDBKeyRange.bound(d1 + '|', d2 + '|￿'));
async function allKeys() { return tx('readonly', s => s.getAllKeys()); }

const sheetIdx = name => SPEC.sheets.findIndex(s => s.name === name);

function paperRows(p) { const sh = SPEC.sheets[sheetIdx(p.sheet)]; const set = new Set(p.rows); return sh.rows.filter(r => set.has(r.r)); }
function normVal(raw) {
  let s = String(raw ?? '').trim().replace(/[０-９．－]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/[，,]/g, '');
  if (s === '') return '';
  if (/^-?\d+(\.\d+)?$/.test(s)) return Number(s);
  if (/^-?\.\d+$/.test(s)) return Number(s);
  return s;
}

    const order = [];
    if (sh.step === 2) order.push([date, 0]);
    for (let i = 1; i <= 10; i++) { const d = addDays(date, -i); if (sh.step === 2) order.push([d, 1], [d, 0]); else order.push([d, 0]); }
    for (const [d, s] of order) { if (d === date && s === 0 && sh.step === 2) continue; const v = vals.get(vkey(d, si, r, s)); if (v) return `${v.v}<br><span style="font-size:11px">${md(d)}${sh.step === 2 ? (s ? ' 16時' : ' 10時') : ''}</span>`; }
    return '';
  };
  let grp = null;
  let html = `<table class="grid"><thead><tr><th>項目</th>${slots.map(s => `<th>${sh.step === 2 ? (s ? '16:00' : '10:00') : '値'}</th>`).join('')}<th>前回</th></tr></thead><tbody>`;
  for (const row of paperRows(p)) {
    const parts = row.full.split(' / '); const g = parts.slice(sheetIdx('電気室受電日誌') === si ? 1 : 0, -1).join(' / ');
    if (g !== grp) { grp = g; html += `<tr class="grp"><td colspan="${slots.length + 2}">${esc(g)}</td></tr>`; }
    html += `<tr><td class="lab">${esc(row.item)}${row.std ? `<div class="std">基準 ${esc(row.std)}</div>` : ''}</td>`;
    for (const s of slots) {
      const k = vkey(date, si, row.r, s); const v = vals.get(k);
      html += `<td class="in"><input class="${row.kind === 'text' ? 'txt' : ''}" ${row.kind === 'num' ? 'inputmode="decimal"' : ''} enterkeyhint="next" data-k="${k}" value="${esc(v ? v.v : '')}" onchange="saveCell(this)" onkeydown="if(event.key==='Enter'){event.preventDefault();nextInput(this)}"></td>`;
    }
    html += `<td class="prev">${prevOf(row.r)}</td></tr>`;
  }
  html += '</tbody></table>';
  const hasText = paperRows(p).some(r => r.kind === 'text');
  box.innerHTML = (hasText ? `<div class="row" style="margin:8px 0"><button class="small" onclick="fillGood()">空いている良否欄を「良」にする</button><span class="muted">「有無」の欄は「無」になります</span></div>` : '') + html;
}
function nextInput(inp) {
  const col = inp.closest('td').cellIndex; // 同じ時刻の列を下へ
  const all = Array.from(document.querySelectorAll('#tbl tr')).map(tr => tr.cells[col] && tr.cells[col].querySelector('input')).filter(Boolean);
  const i = all.indexOf(inp); if (i >= 0 && i < all.length - 1) { all[i + 1].focus(); all[i + 1].select(); } else inp.blur();
}
async function saveCell(inp) {
  const v = normVal(inp.value); const k = inp.dataset.k;
  if (v === '') await dbDel(k); else await dbPut(k, { v, t: Date.now() });
  inp.value = v; inp.classList.add('saved'); setTimeout(() => inp.classList.remove('saved'), 700);
  if (v !== '') { const ym = k.slice(0, 7); if (!LS.get('hasData-' + ym, false)) LS.set('hasData-' + ym, true); }
  updateCount();
}
function updateCount() {
  const b = document.querySelector('.papers button.sel .cnt'); if (!b) return;
  const all = document.querySelectorAll('#tbl input'); const n = Array.from(all).filter(i => i.value !== '').length;
  b.textContent = (n >= all.length ? '✓ ' : '') + `${n} / ${all.length}`; b.classList.toggle('full', n >= all.length);
}
async function fillGood() {
  let n = 0;
  for (const inp of document.querySelectorAll('#tbl input.txt')) {
    if (inp.value) continue;
    const label = inp.closest('tr').querySelector('.lab').textContent;
    if (/マイガード/.test(label)) continue;
    inp.value = /有無/.test(label) ? '無' : '良'; await saveCell(inp); n++;
  }
  toast(`${n}か所に入力しました`);
}

/* ========== 月次Excel ========== */
const MS = { ym: null, file: null };
async function monthList() {
  const keys = await allKeys(); const m = new Map();
  for (const k of keys) { const ym = k.slice(0, 7); m.set(ym, (m.get(ym) || 0) + 1); }
  return [...m.entries()].sort((a, b) => b[0].localeCompare(a[0]));
}
async function viewMonth() {
  if (!MS.ym) MS.ym = prevYm();
  const ym = MS.ym;
  const vals = await valsOfDates(ym + '-01', ym + '-31');
  const per = SPEC.sheets.map(() => new Set());
  for (const k of vals.keys()) { const [d, si] = k.split('|'); per[+si].add(d); }
  const months = await monthList(); const ex = exported();
  $('#main').innerHTML = `
    <h2>書き出す月</h2>
    <div class="row"><input type="month" value="${ym}" onchange="if(this.value){MS.ym=this.value;MS.file=null;viewMonth()}"><b>${ymLabel(ym)}</b>${ex[ym] ? `<span class="pill ok">${md(ex[ym])} 書き出し済み</span>` : ''}</div>
    <div class="card"><div class="stat">${SPEC.sheets.map((s, i) => `<span>${esc(s.name)}</span><span>${per[i].size}日分</span>`).join('')}<b>入力値の合計</b><b>${vals.size}件</b></div></div>
    <div class="row"><button class="primary big" onclick="makeExcel(this)" ${vals.size ? '' : 'disabled'}>① Excelを作成</button></div>
    <div id="mout" style="margin-top:12px"></div>
    <h2>記録のある月</h2>
    <div class="card" style="padding:6px 14px">
      ${months.length ? `<table class="months">${months.map(([m, n]) => `<tr><td><b>${ymLabel(m)}</b></td><td class="muted">${n}件</td><td>${ex[m] ? `<span class="pill ok">${md(ex[m])} 書き出し済み</span>` : '<span class="pill">未書き出し</span>'}</td><td style="text-align:right"><button class="small" onclick="MS.ym='${m}';MS.file=null;viewMonth()">選ぶ</button></td></tr>`).join('')}</table>` : '<p class="muted">まだ記録がありません。</p>'}
    </div>
    <p class="note">入力データはiPadの中にずっと残るので、過去の月もいつでもExcelを作り直せます。ただしiPadの故障・紛失に備えて、毎月書き出したExcelをメールで送って残しておくのが「正式な記録」になります。</p>`;
  if (MS.file) showFile();
}
async function makeExcel(btn) {
  btn.disabled = true; $('#mout').innerHTML = '<span class="spin"></span>作成中…';
  try {
    const blob = await buildXlsx(MS.ym);
    const [y, m] = MS.ym.split('-').map(Number);
    MS.file = new File([blob], `点検記録_${y}年${pad(m)}月.xlsx`, { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    showFile();
  } catch (e) { console.error(e); $('#mout').innerHTML = `<span style="color:var(--err)">⚠ 作成に失敗しました：${esc(e.message)}</span>`; }
  btn.disabled = false;
}
function showFile() {
  const f = MS.file;
  $('#mout').innerHTML = `<div class="card"><b>${esc(f.name)}</b> <span class="muted">${Math.round(f.size / 1024)}KB</span>
    <div class="row" style="margin-top:12px"><button class="primary big" onclick="shareFile()">② メールで送る</button><button onclick="downloadFile()">ファイルに保存</button></div>
    <p class="muted">「メールで送る」→ 出てきたメニューで「メール」を選ぶと、添付された状態で新規メールが開きます。<br>「ファイルに保存」はiPadのファイルアプリ（ダウンロード）に保存します。</p></div>`;
}
function markExported() { const e = exported(); e[MS.ym] = todayStr(); LS.set('exported', e); updateDot(); }
async function shareFile() {
  const f = MS.file;
  if (navigator.canShare && navigator.canShare({ files: [f] })) {
    try { await navigator.share({ files: [f], title: f.name }); markExported(); toast('書き出し済みにしました'); viewMonth(); }
    catch (e) { if (e.name !== 'AbortError') toast('共有できませんでした。「ファイルに保存」をお使いください'); }
  } else toast('この端末では共有できません。「ファイルに保存」をお使いください');
}
function downloadFile() {
  const u = URL.createObjectURL(MS.file); const a = document.createElement('a'); a.href = u; a.download = MS.file.name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000);
  markExported(); setTimeout(viewMonth, 800);
}

/* ---- xlsx 書き込み（ひな形の書式・グラフ・数式はそのまま） ---- */
const colNum = s => { let n = 0; for (const ch of s) n = n * 26 + ch.charCodeAt(0) - 64; return n; };
const colName = n => { let s = ''; while (n > 0) { const r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = Math.floor((n - 1) / 26); } return s; };
class SheetXml {
  constructor(text) {
    this.doc = new DOMParser().parseFromString(text, 'application/xml');
    this.ns = this.doc.documentElement.namespaceURI;
    this.sd = this.doc.getElementsByTagNameNS(this.ns, 'sheetData')[0];
    this.rows = new Map();
    for (const r of Array.from(this.sd.children)) this.rows.set(+r.getAttribute('r'), r);
  }
  row(n) {
    let r = this.rows.get(n); if (r) return r;
    r = this.doc.createElementNS(this.ns, 'row'); r.setAttribute('r', n);
    let next = null; for (const [k, el] of this.rows) if (k > n && (!next || k < +next.getAttribute('r'))) next = el;
    this.sd.insertBefore(r, next); this.rows.set(n, r); return r;
  }
  cell(ref) {
    const m = ref.match(/^([A-Z]+)(\d+)$/); const rowEl = this.row(+m[2]); const cn = colNum(m[1]);
    let next = null;
    for (const c of Array.from(rowEl.children)) {
      const cr = c.getAttribute('r'); if (cr === ref) return c;
      if (!next && colNum(cr.replace(/\d+/g, '')) > cn) next = c;
    }
    const c = this.doc.createElementNS(this.ns, 'c'); c.setAttribute('r', ref); rowEl.insertBefore(c, next); return c;
  }
  set(ref, v) {
    const c = this.cell(ref);
    while (c.firstChild) c.removeChild(c.firstChild);
    c.removeAttribute('t');
    if (v === '' || v === null || v === undefined) return;
    if (typeof v === 'number') { const e = this.doc.createElementNS(this.ns, 'v'); e.textContent = String(v); c.appendChild(e); }
    else { c.setAttribute('t', 'inlineStr'); const is = this.doc.createElementNS(this.ns, 'is'); const t = this.doc.createElementNS(this.ns, 't'); t.textContent = String(v); is.appendChild(t); c.appendChild(is); }
  }
  toString() { return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' + new XMLSerializer().serializeToString(this.doc).replace(/^\s*<\?xml[^>]*\?>\s*/, ''); }
}
async function buildXlsx(ym) {
  const zip = await JSZip.loadAsync(TEMPLATE);
  const [y, m] = ym.split('-').map(Number), dim = daysIn(ym);
  const vals = await valsOfDates(ym + '-01', ym + '-31');
  const serial = d => Math.round((Date.UTC(y, m - 1, d) - Date.UTC(1899, 11, 30)) / 86400000);
  for (let si = 0; si < SPEC.sheets.length; si++) {
    const sh = SPEC.sheets[si]; const path = 'xl/worksheets/' + sh.file;
    const x = new SheetXml(await zip.file(path).async('string'));
    for (let d = 1; d <= 31; d++) {
      const col = sh.day1 + (d - 1) * sh.step;
      x.set(colName(col) + '2', d <= dim ? serial(d) : '');
      if (sh.step === 2) { x.set(colName(col) + '3', d <= dim ? '10:00' : ''); x.set(colName(col + 1) + '3', d <= dim ? '16:00' : ''); }
    }
    if (sh.title) x.set(sh.title, ` ${y}/${m} ～`);
    for (const [k, rec] of vals) {
      const [ds, s, r, slot] = k.split('|'); if (+s !== si) continue;
      const d = +ds.slice(8, 10); if (d > dim) continue;
      x.set(colName(sh.day1 + (d - 1) * sh.step + (+slot)) + r, rec.v);
    }
    zip.file(path, x.toString());
  }
  // グラフ元データの日付ラベル
  { const g = SPEC.graphLabels, path = 'xl/worksheets/' + g.file; const x = new SheetXml(await zip.file(path).async('string'));
    for (const [r, d] of g.cells) x.set('A' + r, d <= dim ? `${m}/${d}` : '');
    zip.file(path, x.toString()); }
  // ダッシュボードの対象期間
  { const D = SPEC.dashboard, path = 'xl/worksheets/' + D.file; const x = new SheetXml(await zip.file(path).async('string'));
    x.set(D.cell, D.text.replace(/\d{4}年\d{1,2}月/, `${y}年${m}月`)); zip.file(path, x.toString()); }
  // 開いたときに再計算させる
  let wb = await zip.file('xl/workbook.xml').async('string');
  wb = /<calcPr\b/.test(wb) ? wb.replace(/<calcPr\b([^>]*?)(\/?)>/, (a, attrs, sl) => `<calcPr${attrs.replace(/\sfullCalcOnLoad="[^"]*"/, '')} fullCalcOnLoad="1"${sl}>`) : wb.replace('</workbook>', '<calcPr fullCalcOnLoad="1"/></workbook>');
  zip.file('xl/workbook.xml', wb);
  return zip.generateAsync({ type: 'blob', compression: 'DEFLATE', mimeType: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}



/* ========== 設定 ========== */
async function viewSet() {
  let est = ''; try { const e = await navigator.storage.estimate(); est = `使用量 ${(e.usage / 1048576).toFixed(1)}MB`; } catch (e) {}
  const persisted = navigator.storage && navigator.storage.persisted ? await navigator.storage.persisted() : false;
  $('#main').innerHTML = `
    <h2>バックアップ</h2>
    <div class="card">
      <p class="muted">全期間の入力データを1つのファイルに書き出します。iPadを替えるときや、万一に備えて使います。</p>
      <div class="row"><button onclick="exportBackup()">書き出す</button><label class="btn">読み込む<input type="file" accept=".json,application/json" class="hide" onchange="importBackup(this)"></label></div>
    </div>
    <h2>この端末</h2>
    <div class="card muted">${est}${persisted ? '・データ保護 有効' : ''}<br>バージョン ${VERSION}<br>
      ※ データはこのiPadの中だけに保存されます。必ずホーム画面のアイコンから開いてください（Safariで直接開くとデータが別になります）。</div>`;
}
async function exportBackup() {
  const m = await valsRange(IDBKeyRange.lowerBound(''));
  const data = { app: 'tenken', version: VERSION, at: new Date().toISOString(), vals: [...m.entries()], exported: exported() };
  const f = new File([JSON.stringify(data)], `点検記録_バックアップ_${todayStr()}.json`, { type: 'application/json' });
  if (navigator.canShare && navigator.canShare({ files: [f] })) { try { await navigator.share({ files: [f] }); } catch (e) {} }
  else { const u = URL.createObjectURL(f); const a = document.createElement('a'); a.href = u; a.download = f.name; a.click(); }
}
async function importBackup(inp) {
  const f = inp.files[0]; if (!f) return;
  try {
    const d = JSON.parse(await f.text()); if (d.app !== 'tenken') throw new Error('形式が違います');
    if (!(await confirmDlg(`バックアップ（${esc(d.at.slice(0, 10))}・${d.vals.length}件）を読み込みます。同じ欄はバックアップの値で上書きされます。`, '読み込む'))) return;
    await dbPutMany(d.vals);
    for (const [k] of d.vals) LS.set('hasData-' + k.slice(0, 7), true);
    LS.set('exported', Object.assign({}, d.exported || {}, exported()));
    toast('読み込みました'); updateDot();
  } catch (e) { toast('読み込めませんでした：' + e.message); }
  inp.value = '';
}

/* ========== 起動 ========== */
async function start() {
  $('#lock').classList.add('hide'); $('#app').classList.remove('hide');
  await openDB();
  try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch (e) {}
  updateDot(); go('input');
}
(async () => {
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  const pw = LS.get('pw', '');
  if (pw) { try { await decryptPayload(pw); return start(); } catch (e) {} }
  $('#lock').classList.remove('hide');
  $('#pw').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });
})();
